description: >-
  Aptiv publishes no API plans or pricing of any kind, because it publishes no
  API product. It is a Tier-1 automotive and aerospace supplier whose software
  (the LINC software platform, ADAS software, Aptiv Connect Qualifier
  preproduction-validation analytics) is sold to OEMs under negotiated program
  contracts. The only commercial entry points on the public site are contact
  and "connect with an engineer" forms and a demo request for Qualifier.
