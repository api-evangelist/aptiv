description: >-
  Aptiv is a Fortune 500 Tier-1 automotive and aerospace technology supplier headquartered in
  Dublin, Ireland, formed from Delphi Automotive in 2017. It sells electrical architecture and
  interconnect systems (connectors, cabling, busbars, HellermannTyton fastening), advanced
  driver-assistance systems, digital cockpit and advanced compute hardware, and embedded software:
  the Aptiv LINC software platform, ADAS software, and Aptiv Connect Qualifier preproduction
  validation analytics, with Wind River (acquired 2022) as its intelligent-edge software business.
  Aptiv publishes no public API, developer portal, SDK or machine-readable contract; its software
  platforms are delivered to OEMs under program contracts, and its only public developer-facing
  material is marketing prose about the "open APIs" inside those platforms.
