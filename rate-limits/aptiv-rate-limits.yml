description: >-
  Aptiv publishes no rate limits, because it publishes no hosted API to limit.
  Its software platforms (LINC, ADAS software, Connect Qualifier) are delivered
  to OEMs under program contracts with no public developer documentation, so
  there are no documented quotas, windows, 429 semantics or rate-limit headers.
notes: >-
  limit_count 0 is a measured zero, not an unchecked field. The prior version
  of this artifact was a bulk-sweep placeholder that asserted a 429 response
  code and a per-contract limit nobody had observed; both are removed.
